name: Lead routing bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chay thu, khong ghi du lieu that (true/false) - chi ap dung cho script route'
        required: false
        default: 'false'
      script:
        description: 'Script muon chay'
        required: false
        default: 'route'
        type: choice
        options:
          - route
          - inspect-base
          - list-chats

jobs:
  route-leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Chay script
        env:
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_NOTIFY_CHAT_ID: ${{ secrets.LARK_NOTIFY_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          case "${{ github.event.inputs.script || 'route' }}" in
            inspect-base) node scripts/inspect-base.mjs ;;
            list-chats) node scripts/list-chats.mjs ;;
            *) node scripts/poll-and-route.mjs ;;
          esac
